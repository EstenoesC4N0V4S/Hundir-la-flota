<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hundir la Flota</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container py-4">

        <div class="game-container">

            <div class="text-center mb-3">
                <div class="title-icon">
                    <i class="bi bi-water"></i>
                </div>

                <h1>Hundir la Flota</h1>

                <p>
                    Encuentra los 5 barcos antes de cometer 6 fallos.
                </p>
            </div>

            <!-- Estadísticas -->
            <div class="row g-2 mb-3">

                <div class="col-4">
                    <div class="stat-card">
                        <i class="bi bi-bullseye"></i>
                        <span>Aciertos</span>
                        <strong id="hits">0</strong>
                    </div>
                </div>

                <div class="col-4">
                    <div class="stat-card">
                        <i class="bi bi-droplet"></i>
                        <span>Fallos</span>
                        <strong id="misses">0</strong>
                    </div>
                </div>

                <div class="col-4">
                    <div class="stat-card">
                        <i class="bi bi-tsunami"></i>
                        <span>Barcos</span>
                        <strong id="ships">0 / 5</strong>
                    </div>
                </div>

            </div>

            <!-- Mensaje -->
            <div id="message" class="game-message">
                Haz clic en una casilla para comenzar.
            </div>

            <!-- Tablero -->
            <div id="game-board" class="game-board"></div>

            <!-- Botón -->
            <div class="text-center mt-3">
                <button id="restart" class="btn restart-button" type="button">
                    <i class="bi bi-arrow-repeat"></i>
                    Nueva partida
                </button>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
